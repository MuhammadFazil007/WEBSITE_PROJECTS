<!-- Use of GetElementsByTagName() method to access an element and change its content.
Use of Length Property to find the number of elements in a collection. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Example 3</title>

    <style>
        div {
            border: 2px solid black;
            margin: 5px;
        }
    </style>
</head>
<body>
    <uL>
        <li> Coffee</li>
        <li> Tea</li>

    </uL>
    <p> Click the button to change the text of the first list item (index  0)</p>
    <button onclick = "myfunction()">Try It</button>
    <script>
        function myfunction()
        {
            var list = document.getElementsByTagName("ul")[0];
            list.getElementsByTagName("li")[0].innerHTML = "Milk";
        }
    </script>

    <div id = "MYDIV">
        <p> A <strong>P</strong> Element in Div</p>
        <p> Another <strong>P</strong> Element in Div</p>
        <p> A Third <strong>P</strong> Element in Div</p>

    </div>
        <p> Click the button to find the number of <strong>P</strong> elements in the div element.</p>
        <button onclick = "myFunction()">Try It</button>

        <p> Click on the Button to change the Background Color of Second <Strong>P</Strong></p>
        <button onclick = "changeColor('red')"> Change Color </button>
        <script>
            function myFunction()
            {
                var x = document.getElementById("MYDIV");
                var y = x.getElementsByTagName("P");
                alert("Number of P Elements in Div is: " + y.length);
            }
            function changeColor(newColor)
            {
                var x = document.getElementById("MYDIV")
                var y = x.getElementsByTagName("p");
                y[1].style.backgroundColor = newColor;

                
            }
        </script>
    
</body>
</html>
