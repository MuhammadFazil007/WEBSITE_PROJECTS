<!DOCTYPE html>
<html>
<head>
    <title>Real-World JSON - Shopping Cart</title>
    <style>
        .cart-item { border: 1px solid #ddd; padding: 10px; margin: 5px; display: flex; justify-content: space-between; }
        .total { font-size: 20px; font-weight: bold; background: gold; padding: 10px; }
    </style>
</head>
<body>
    <h2>🛍️ JSON Shopping Cart System</h2>
    <div id="cartDisplay"></div>
    <button onclick="addItem()">Add Sample Item</button>
    <button onclick="saveCartToLocalStorage()">💾 Save Cart (JSON to localStorage)</button>
    <button onclick="loadCartFromLocalStorage()">📂 Load Cart (JSON from localStorage)</button>
    <button onclick="clearCart()">🗑️ Clear Cart</button>

    <script>
        // Shopping cart stored as JSON array
        let shoppingCart = [];
        
        // Load from localStorage if exists
        function loadCartFromLocalStorage() {
            const savedCart = localStorage.getItem('shoppingCart');
            if (savedCart) {
                shoppingCart = JSON.parse(savedCart);
                renderCart();
                alert("Cart loaded from localStorage!");
            } else {
                alert("No saved cart found!");
            }
        }
        
        function saveCartToLocalStorage() {
            const cartJSON = JSON.stringify(shoppingCart);
            localStorage.setItem('shoppingCart', cartJSON);
            alert(`Cart saved! JSON length: ${cartJSON.length} characters`);
        }
        
        function addItem() {
            const newItem = {
                id: Date.now(),
                name: `Product ${Math.floor(Math.random() * 1000)}`,
                price: Math.floor(Math.random() * 5000) + 100,
                quantity: 1,
                addedAt: new Date().toISOString()
            };
            shoppingCart.push(newItem);
            renderCart();
        }
        
        function updateQuantity(id, newQuantity) {
            const item = shoppingCart.find(i => i.id === id);
            if (item) {
                item.quantity = Math.max(0, newQuantity);
                if (item.quantity === 0) {
                    shoppingCart = shoppingCart.filter(i => i.id !== id);
                }
                renderCart();
            }
        }
        
        function renderCart() {
            const cartDiv = document.getElementById('cartDisplay');
            if (shoppingCart.length === 0) {
                cartDiv.innerHTML = "<p>Cart is empty</p>";
                return;
            }
            
            // Complex JSON operations: reduce, map, filter
            const subtotal = shoppingCart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.17; // 17% tax
            const total = subtotal + tax;
            
            const cartHTML = `
                <div class="total">Subtotal: Rs. ${subtotal.toLocaleString()} | Tax: Rs. ${tax.toLocaleString()} | Total: Rs. ${total.toLocaleString()}</div>
                ${shoppingCart.map(item => `
                    <div class="cart-item">
                        <div>
                            <strong>${item.name}</strong><br>
                            Price: Rs. ${item.price} | Quantity: ${item.quantity}<br>
                            <small>Added: ${new Date(item.addedAt).toLocaleTimeString()}</small>
                        </div>
                        <div>
                            <button onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                            <button onclick="updateQuantity(${item.id}, 0)">Remove</button>
                        </div>
                    </div>
                `).join('')}
            `;
            cartDiv.innerHTML = cartHTML;
        }
        
        // Initial render
        renderCart();
        
        // JSON summary function
        function getCartSummary() {
            const summary = {
                totalItems: shoppingCart.reduce((sum, item) => sum + item.quantity, 0),
                uniqueProducts: shoppingCart.length,
                totalValue: shoppingCart.reduce((sum, item) => sum + (item.price * item.quantity), 0),
                lastUpdated: new Date().toISOString()
            };
            return JSON.stringify(summary, null, 2);
        }
        
        // Debug: Show JSON summary in console
        setInterval(() => {
            console.log("Cart JSON Summary:", getCartSummary());
        }, 5000);
    </script>
</body>
</html>
