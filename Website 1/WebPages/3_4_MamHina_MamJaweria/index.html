<!DOCTYPE html>
<html lang="en">
<head>
    
</head>
<body>
    <h2> 1. Static Position </h2>
    <div style="position: static; border: 2px solid black;">
        <p>I am Static (default position)</p>
    </div>
    <div style="position: relative; left: 50px; top: 20px; border: 2px solid blue;">
    <p>I moved 50px right and 20px down </p>
    </div>
    <div style="position: relative; height: 200px; border: 2px solid black;">
    
        <div style="position: absolute; top: 50px; right: 90px; background: yellow;">
            <p>I am Absolute</p>
        </div>

    </div>

    
</body>
</html>
